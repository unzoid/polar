[package]
name = "rustio-index"
description = "Media indexer in the spirit of Cinemeta: catalogs + metadata keyed by IMDb ids"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Standalone HTTP addon server (`cargo run -p rustio-index --features server`),
# installable in rustio *or* Stremio as a regular addon.
server = ["dep:axum", "dep:tower-http", "dep:tracing-subscriber"]

[dependencies]
rustio-addon.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
urlencoding.workspace = true

axum = { version = "0.8", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[[bin]]
name = "rustio-index"
path = "src/bin/rustio-index.rs"
required-features = ["server"]
