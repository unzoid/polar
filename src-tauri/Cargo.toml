[package]
name = "polar"
description = "A fast, fluid media center"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "polar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# macos-private-api: a transparent window on macOS (mpv draws under the page); no-op elsewhere.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
polar-addon.workspace = true
polar-anime.workspace = true
polar-index.workspace = true
polar-library.workspace = true
polar-player.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# gilrs has no Android or iOS backend; phones and TVs see controllers through the Gamepad API.
gilrs = "0.11"
keyring = "4.2"
# Torrent playback of the user's add-on streams; desktop first (#47).
polar-torrent.workspace = true
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# The file dialog behind "Open File…" (#204).
tauri-plugin-dialog = "2"

# Notifications (#209): the desktop's notification service on the session bus. Already in the
# build through keyring and the opener plugin.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Notifications (#209): toasts. Already in the build through tauri and wry; only its toast and
# XML parts are added.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications"] }

[target.'cfg(target_os = "android")'.dependencies]
# libmpv loaded from the APK and given the SurfaceView (player/android.rs); the same versions
# tao already uses.
jni = "0.21"
libc = "0.2"
ndk-context = "0.1"
