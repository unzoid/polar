[package]
name = "polar"
description = "A fast, fluid media center"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "polar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# macos-private-api: a transparent window on macOS (mpv draws under the page); no-op elsewhere.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
polar-addon.workspace = true
polar-anime.workspace = true
polar-index.workspace = true
polar-library.workspace = true
polar-player.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"

# Free disk space for the Downloads page (disk.rs); both already built in through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# gilrs has no Android or iOS backend; phones and TVs see controllers through the Gamepad API.
gilrs = "0.11"
keyring = "4.2"
# Torrent playback of the user's add-on streams; desktop first (#47).
polar-torrent.workspace = true
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# The file dialog behind "Open File…" (#204).
tauri-plugin-dialog = "2"
# polarity:// links from the website's /watch and /party pages (#153); a link opened while Polarity
# runs goes to the running app.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "android")'.dependencies]
# libmpv loaded from the APK and given the SurfaceView (player/android.rs); the same versions
# tao already uses.
jni = "0.21"
ndk-context = "0.1"
