[package]
name = "polar"
description = "A fast, fluid media center"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "polar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
# macos-private-api: a transparent window on macOS (mpv draws under the page); no-op elsewhere.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
polar-addon.workspace = true
polar-anime.workspace = true
polar-index.workspace = true
polar-library.workspace = true
polar-player.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
futures.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.22"
gilrs = "0.11"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
