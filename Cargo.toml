[workspace]
resolver = "2"
members = ["crates/addon", "crates/index", "src-tauri"]

[workspace.package]
version = "0.13.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
polar-addon = { path = "crates/addon" }
polar-index = { path = "crates/index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "gzip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "fs"] }
futures = "0.3"
thiserror = "2"
tracing = "0.1"
urlencoding = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
