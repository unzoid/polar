<circle class="s2 ring" cx="272" cy="52" r="4"/><text class="ink2" x="282" y="56" font-size="13">ease-in-out</text>
<line class="axis" x1="64" x2="684" y1="372" y2="372"/><text class="ink2" x="56" y="376" font-size="12" text-anchor="end">0%</text>
