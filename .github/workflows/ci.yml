name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR replaces its running checks; every commit on
# master keeps its own run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # a new Bun release can't break --frozen-lockfile
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  # The web build in real browsers against the fake shell (playwright.config.ts):
  # desktop in Chromium and WebKit, TV and phone sizes in Chromium.
  e2e-web:
    name: End to end (web build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's own image for the version in bun.lock (1.64.1), pinned by digest: the browsers'
    # system packages are already installed, so no run depends on Ubuntu's package mirror. Running
    # as the runner's user (1001) follows Playwright's guide for GitHub Actions. When @playwright/test
    # is updated, this image and its digest are updated with it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-bun needs unzip, which Playwright's image doesn't have; the image has Node and npm, so
      # the same Bun version comes from npm instead, into the job's temporary folder.
      - name: Install Bun
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/bun" bun@1.4.4
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p e2e
      # The image already carries the browsers and their system packages; this only checks that the
      # browsers match the installed Playwright and fetches them if not. Each attempt gets 5 minutes,
      # and a stalled one is tried again.
      - name: Install the browsers
        run: |
          for attempt in 1 2 3; do
            timeout 300 bunx playwright install chromium webkit && exit 0
            echo "::warning::Installing the browsers failed or stalled (attempt $attempt of 3)"
          done
          exit 1
      - run: bun run e2e
      - name: Keep the report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy
      # Caches are saved from master only and restored everywhere: one copy per cache keeps the
      # repository under GitHub's 10 GB, so they aren't evicted and pull requests start warm.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Linux: the web view (WebKitGTK) and what tauri and gilrs link against.
      # mpv runs as its own process there, so nothing of it is linked.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev
      # Debug builds (tests, clippy) don't embed the frontend, so no `dist` is
      # needed. On Windows tauri-build does need the bundled mpv files listed in
      # tauri.windows.conf.json; macOS loads an installed libmpv at runtime.
      # The mpv.exe job windows-mpv built for this version, or empty stand-ins
      # while it hasn't yet: nothing here plays video.
      - name: Version of the Windows mpv
        if: runner.os == 'Windows'
        id: mpv
        shell: bash
        run: echo "key=$(cat scripts/windows-mpv.sh scripts/windows-mpv.lock | tr -d '\r' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the Windows mpv
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv/out
          key: windows-mpv-${{ steps.mpv.outputs.key }}
          enableCrossOsArchive: true
      - name: Put mpv in the app
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/vendor-mpv.sh windows-mpv/out
      - run: cargo test --workspace --locked
      - run: cargo build -p polar-index --features server --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # mpv.exe for the Windows app, built from pinned sources in mpv-winbuild-cmake's
  # build image (scripts/windows-mpv.sh, docs/licensing.md): once per version of
  # the script and its lock, then restored from the cache. The first build also
  # makes the MinGW toolchain, kept on its own so a run cut off by the time limit
  # goes on from there. The artifact (mpv.exe, licence texts, the exact sources)
  # is what scripts/fetch-mpv.ts takes for Windows builds and releases.
  windows-mpv:
    name: Windows mpv (pinned build)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      # ghcr.io/shinchiro/archlinux:latest as pulled on 2026-11-06
      image: ghcr.io/shinchiro/archlinux@sha256:56a74bc68139d108ee082f1d0a488295eaf5af2f1b79f0cbbb7caca1c4402bbd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: echo "key=$(cat scripts/windows-mpv.sh scripts/windows-mpv.lock | tr -d '\r' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore this build
        id: built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv/out
          key: windows-mpv-${{ steps.version.outputs.key }}
          enableCrossOsArchive: true
      - name: Restore the work folder
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv
          key: windows-mpv-work-${{ steps.version.outputs.key }}
          restore-keys: windows-mpv-work-
      - name: Build the toolchain
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/windows-mpv.sh windows-mpv toolchain
      - name: Keep the work folder
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv
          key: windows-mpv-work-${{ steps.version.outputs.key }}
      - name: Build mpv
        if: steps.built.outputs.cache-hit != 'true'
        run: scripts/windows-mpv.sh windows-mpv
      - name: Keep this build
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: windows-mpv/out
          key: windows-mpv-${{ steps.version.outputs.key }}
          enableCrossOsArchive: true
      # When a repository isn't pinned (or not as the lock says): what the run
      # cloned, to review and copy into scripts/windows-mpv.lock.
      - name: Keep the list of what was cloned
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-lock
          path: windows-mpv/out/windows-mpv.lock
          if-no-files-found: ignore
          retention-days: 14
      # Every package's step logs (the job prints the failed one's) and CMake's
      # record of its checks, with the commands they ran.
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-logs
          path: |
            windows-mpv/ninja.log
            windows-mpv/build/**/*-stamp/*.log
            windows-mpv/build/**/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep mpv.exe and its sources
        if: github.ref == 'refs/heads/master' || steps.built.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mpv-${{ steps.version.outputs.key }}
          path: |
            windows-mpv/out/mpv
            windows-mpv/out/polarity-windows-mpv-sources.tar
          compression-level: 0
          retention-days: 90

  # The Android app (src-tauri/gen/android, docs/plan-mobile.md §2) as a debug
  # APK for the emulator (x86_64) and phones (aarch64), and as an unsigned
  # release APK and bundle. Debug builds carry Android's throwaway debug key;
  # release signing waits for the owner's key.
  # The runner image has the Android SDK and NDKs; the platform the project
  # compiles against is installed here in case the image lags behind it.
  # libmpv and FFmpeg (scripts/android-mpv.sh, docs/plan-mobile.md §7) are
  # built once and kept until the script, and so a pinned version, changes;
  # the sources they're built from are kept with the APK.
  android:
    name: Android build (debug and unsigned release)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-linux-android,x86_64-linux-android
      # Caches are saved from master only and restored everywhere: one copy per cache keeps the
      # repository under GitHub's 10 GB, so they aren't evicted and pull requests start warm.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the Android platform
        run: |
          sdk="$(sed -n 's/.*compileSdk = \([0-9]*\).*/\1/p' src-tauri/gen/android/app/build.gradle.kts)"
          # `yes` ends on SIGPIPE, which pipefail would count as a failure.
          # From API 37 on, platform packages carry a minor version (platforms;android-37.0).
          pkg="platforms;android-$sdk"; [ "$sdk" -ge 37 ] && pkg="$pkg.0"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$pkg"
      # The runner image's newest NDK is a shell variable there, not part of the workflow's `env`
      # context (so `${{ env.ANDROID_NDK_LATEST_HOME }}` is empty); hand it to the later steps.
      - name: Use the runner's NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:?the runner image has no Android NDK}}" >> "$GITHUB_ENV"
      - name: Restore libmpv
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/libmpv/out
          key: android-libmpv-${{ hashFiles('scripts/android-mpv.sh') }}
      - name: Build libmpv
        if: steps.libmpv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build gperf nasm
          pipx install meson
          scripts/android-mpv.sh "$RUNNER_TEMP/libmpv" arm64 x86_64
      - name: Put libmpv in the app
        run: cp -R "$RUNNER_TEMP/libmpv/out/jniLibs" "$RUNNER_TEMP/libmpv/out/assets" src-tauri/gen/android/app/src/main/
      # Pull requests build the debug APK for arm64 only (what phones run); master builds both. The
      # emulator test in e2e-app.yml builds its own x86_64 APK.
      - name: Build
        run: bun run tauri android build --ci --debug --apk ${{ github.ref == 'refs/heads/master' && '--target x86_64 --target aarch64' || '--target aarch64' }}
      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14
      # The unsigned release APK and app bundle are built on master only.
      - name: Build the release (unsigned)
        if: github.ref == 'refs/heads/master'
        run: bun run tauri android build --ci --apk --aab --target x86_64 --target aarch64
      - name: Keep the release
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-unsigned
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 14
      - name: Keep libmpv's sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-mpv-sources
          path: ${{ runner.temp }}/libmpv/out/polarity-android-mpv-sources.tar.xz
          compression-level: 0
          retention-days: 14

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
