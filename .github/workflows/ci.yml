name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # tauri-build needs ../dist to exist, and on Windows the bundled mpv
      # files listed in tauri.windows.conf.json (fetch-mpv is a no-op on macOS).
      - run: bun install --frozen-lockfile
      - run: bunx vite build
      - run: bun scripts/fetch-mpv.ts
      - run: cargo test --workspace --locked
      - run: cargo build -p polar-index --features server --locked
      # Advisory until the existing code is clippy-clean; then drop
      # continue-on-error so new warnings fail the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        continue-on-error: true

  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    # Advisory until `cargo fmt --all` has been run once over the codebase.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
