name: App end to end

# The built app driven through tauri-driver (e2e/app/smoke.ts): slow, so
# nightly and on master only (docs/plan-tests.md, I-010), not on every push.
# macOS has no WKWebView driver, so Linux and Windows only.
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: App smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # As in ci.yml, plus WebKitWebDriver and a virtual display for tauri-driver.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libudev-dev \
            webkit2gtk-driver xvfb
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Cache bundled mpv
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/vendor/mpv
          key: mpv-${{ runner.os }}-${{ hashFiles('scripts/fetch-mpv.ts') }}
      - run: cargo install tauri-driver --version 2.1.0 --locked
      # msedgedriver of the same version as the runner's WebView2 (Tauri's own
      # CI guide), pinned to a commit.
      - name: Install msedgedriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      # The frontend embedded, no installers or updater files.
      - run: bun run tauri build --debug --no-bundle -- --locked
      - name: Smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a bun e2e/app/smoke.ts
      - name: Smoke test
        if: runner.os == 'Windows'
        run: bun e2e/app/smoke.ts
